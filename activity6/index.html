<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Dojo</title>
    <style>
        body {
            padding: 40px;
        }

        .ui-badge {
            display: inline-block;
            background-color: #E0F2FE;
            color: #0369A1;
            font-weight: bold;
            font-family: Arial, sans-serif;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .ui-pill {
            display: inline-block;
            background-color: #22C55E;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 500;
            font-family: Arial, sans-serif;
            padding: 6px 16px;
            border-radius: 9999px;
            margin-bottom: 16px;
        }

        .ui-avatar {
            display: block;
            width: 64px;
            height: 64px;
            background-color: #E2E8F0;
            border-radius: 50%;
            color: #1E3A8A;
            font-size: 20px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-align: center;
            line-height: 64px;
            margin-bottom: 16px;
        }

        .ui-btn {
            display: block;
            background-color: #4F46E5;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            font-family: Arial, sans-serif;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .ui-btn:hover {
            background-color: #4338CA;
        }

        .field-group {
            width: 240px;
            margin-bottom: 16px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-family: Arial, sans-serif;
        }

        .input-element {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            border: 2px solid #CBD5E1;
            border-radius: 6px;
            font-size: 14px;
            color: #0F172A;
            background-color: #FFFFFF;
            font-family: Arial, sans-serif;
        }

        /* Makes the placeholder text look light and semi-transparent */
        .input-element::placeholder {
            color: #94A3B8;
            opacity: 0.6;
        }

        .input-element:focus {
            outline: none;
            border-color: #3B82F6;
            background-color: #F8FAFC;
        }

        .alert-container {
            display: block;
            box-sizing: border-box;
            background-color: #FEE2E2;
            border-left: 5px solid #EF4444;
            border-radius: 4px;
            padding: 14px 18px;
            width: 340px;
            margin-bottom: 16px;
        }

        .alert-message {
            font-size: 13px;
            font-weight: 500;
            color: #991B1B;
            font-family: Arial, sans-serif;
        }

        .feature-card {
            display: block;
            box-sizing: border-box;
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 24px;
            width: 280px;
            margin-bottom: 16px;
        }

        .card-icon {
            display: block;
            margin-bottom: 12px;
            font-size: 24px;
        }

        .feature-card h3 {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            margin: 0;
            margin-bottom: 6px;
            font-family: Arial, sans-serif;
        }

        .feature-card p {
            font-size: 13px;
            color: #64748B;
            line-height: 1.4;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .nav-menu {
            display: block;
            box-sizing: border-box;
            list-style: none;
            margin: 0;
            padding: 8px;
            width: 200px;
            background-color: #1E293B;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .nav-link {
            margin-bottom: 4px;
        }

        .nav-link:last-child {
            margin-bottom: 0;
        }

        .nav-link a {
            display: block;
            box-sizing: border-box;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #94A3B8;
            text-decoration: none;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }

        .nav-link a:hover {
            color: #FFFFFF;
            background-color: #334155;
        }

        .nav-link.active-item a {
            color: #38BDF8;
            background-color: #0F172A;
            font-weight: 600;
        }

        .nav-link.active-item a:hover {
            color: #38BDF8;
            background-color: #0F172A;
        }
    </style>
</head>
<body>
    <span class="ui-badge">New</span><br>
    <span class="ui-pill">Active User</span><br>
    <div class="ui-avatar">JD</div>
    <button class="ui-btn">Create Account</button><br>
    <div class="field-group">
        <label>Email Address</label>
        <input type="email" class="input-element" placeholder="you@example.com">
    </div>
    <div class="alert-container">
        <div class="alert-message">⚠️ Your storage limit is almost full.</div>
    </div><br>
    <div class="feature-card">
        <span class="card-icon">⚡</span>
        <h3>Fast Speed</h3>
        <p>Our edge network delivers your text content instantly.</p>
    </div><br>
    <ul class="nav-menu">
        <li class="nav-link active-item"><a href="#">Home</a></li>
        <li class="nav-link"><a href="#">Files</a></li>
        <li class="nav-link"><a href="#">Apps</a></li>
    </ul>
</body>
</html>
