<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="quote-card">
            <p class="quote">"The best way to learn CSS is to break things and rebuild them."</p>
            <p class="author">— A Wise Developer</p>
        </div>

        <div class="stats-row">
            <div class="stat-col">
                <p class="number">128</p>
                <p class="label">Projects</p>
            </div>
            <div class="stat-col">
                <p class="number">4.9★</p>
                <p class="label">Rating</p>
            </div>
            <div class="stat-col">
                <p class="number">99%</p>
                <p class="label">Uptime</p>
            </div>
        </div>

        <div class="input-field">
            <p class="label">Email Address</p>
            <input type="email" placeholder="you@example.com">
            <p class="helper">We'll never share your email.</p>
        </div>

        <div class="banner">
            <p class="title">Make it Beautiful</p>
            <p class="subtitle">CSS gradients can be applied to text, not just backgrounds.</p>
        </div>

        <div class="price-badge">
            <p class="plan-label">Premium Plan</p>
            <p class="old-price">₱2,400/yr</p>
            <p class="new-price">₱1,200/yr</p>
            <span class="save-badge">Save 50%</span>
        </div>
    </main>
</body>
</html>
